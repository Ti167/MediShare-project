<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Register - Medi-Share</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center">
    <div class="w-full max-w-4xl mx-4 my-8">
        <!-- Logo -->
        <div class="text-center mb-8">
            <i class="fa-solid fa-pills text-blue-600 text-4xl"></i>
            <h1 class="text-2xl font-bold text-gray-800 mt-2">Medi-Share</h1>
        </div>

        <!-- Toggle Buttons -->
        <div class="flex justify-center mb-6">
            <button id="showLogin" class="px-6 py-2 bg-blue-600 text-white rounded-l-lg font-medium">Login</button>
            <button id="showRegister" class="px-6 py-2 bg-gray-200 text-gray-600 rounded-r-lg font-medium hover:bg-gray-300">Register</button>
        </div>

        <!-- Login Form -->
        <div id="loginForm" class="bg-white rounded-xl shadow-lg p-8">
            <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">Welcome Back</h2>
            <form method="POST" action="login.php">
                <div class="mb-4">
                    <label class="block text-gray-700 font-medium mb-2">Email</label>
                    <input type="email" name="email" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none">
                </div>
                <div class="mb-6">
                    <label class="block text-gray-700 font-medium mb-2">Password</label>
                    <input type="password" name="password" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none">
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 transition">
                    <i class="fa-solid fa-sign-in-alt mr-2"></i>Login
                </button>
            </form>
            <p class="text-center mt-4 text-gray-600">Don't have an account? <a href="#" id="switchToRegister" class="text-blue-600 hover:underline">Register here</a></p>
        </div>

        <!-- Registration Form -->
        <div id="registerForm" class="bg-white rounded-xl shadow-lg p-8 hidden">
            <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">Create Account</h2>
            <form method="POST" action="register.php">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="mb-4">
                        <label class="block text-gray-700 font-medium mb-2">Full Name</label>
                        <input type="text" name="full_name" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none">
                    </div>
                    <div class="mb-4">
                        <label class="block text-gray-700 font-medium mb-2">Email</label>
                        <input type="email" name="email" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none">
                    </div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="mb-4">
                        <label class="block text-gray-700 font-medium mb-2">Password</label>
                        <input type="password" name="password" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none">
                    </div>
                    <div class="mb-4">
                        <label class="block text-gray-700 font-medium mb-2">Role</label>
                        <select name="role" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none">
                            <option value="donor">Donor</option>
                            <option value="ngo">NGO</option>
                        </select>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 font-medium mb-2">Contact Number</label>
                    <input type="text" name="contact_number" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none">
                </div>
                <div class="mb-6">
                    <label class="block text-gray-700 font-medium mb-2">Address</label>
                    <textarea name="address" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none" rows="3"></textarea>
                </div>
                <button type="submit" class="w-full bg-emerald-500 text-white py-3 rounded-lg font-semibold hover:bg-emerald-600 transition">
                    <i class="fa-solid fa-user-plus mr-2"></i>Register
                </button>
            </form>
            <p class="text-center mt-4 text-gray-600">Already have an account? <a href="#" id="switchToLogin" class="text-blue-600 hover:underline">Login here</a></p>
        </div>
    </div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');
        const showLoginBtn = document.getElementById('showLogin');
        const showRegisterBtn = document.getElementById('showRegister');
        const switchToRegister = document.getElementById('switchToRegister');
        const switchToLogin = document.getElementById('switchToLogin');

        function showLogin() {
            loginForm.classList.remove('hidden');
            registerForm.classList.add('hidden');
            showLoginBtn.classList.add('bg-blue-600', 'text-white');
            showLoginBtn.classList.remove('bg-gray-200', 'text-gray-600');
            showRegisterBtn.classList.remove('bg-blue-600', 'text-white');
            showRegisterBtn.classList.add('bg-gray-200', 'text-gray-600');
        }

        function showRegister() {
            loginForm.classList.add('hidden');
            registerForm.classList.remove('hidden');
            showRegisterBtn.classList.add('bg-blue-600', 'text-white');
            showRegisterBtn.classList.remove('bg-gray-200', 'text-gray-600');
            showLoginBtn.classList.remove('bg-blue-600', 'text-white');
            showLoginBtn.classList.add('bg-gray-200', 'text-gray-600');
        }

        showLoginBtn.addEventListener('click', showLogin);
        showRegisterBtn.addEventListener('click', showRegister);
        switchToRegister.addEventListener('click', (e) => { e.preventDefault(); showRegister(); });
        switchToLogin.addEventListener('click', (e) => { e.preventDefault(); showLogin(); });
    </script>
</body>
</html>
